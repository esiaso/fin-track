name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fintrack, POSTGRES_PASSWORD: fintrack, POSTGRES_DB: fintrack_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintrack" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test?schema=public
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fintrack/shared build
      - run: pnpm --filter @fintrack/api prisma:generate
      - run: pnpm -r typecheck
      - run: pnpm --filter @fintrack/shared test
      - run: pnpm --filter @fintrack/api test
      - run: pnpm --filter @fintrack/web build
