# Local / demo stack. For production see docs/deployment.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &apienv
      DATABASE_URL: postgresql://fintrack:fintrack@postgres:5432/fintrack?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      INTEGRATION_SECRET_CLINITRACK: ${INTEGRATION_SECRET_CLINITRACK:-dev-clinitrack-secret}
      INTEGRATION_SECRET_SUPPLYTRACK: ${INTEGRATION_SECRET_SUPPLYTRACK:-dev-supplytrack-secret}
      INTEGRATION_SECRET_PEOPLETRACK: ${INTEGRATION_SECRET_PEOPLETRACK:-dev-peopletrack-secret}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *apienv
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *apienv
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
